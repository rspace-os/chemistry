spring.application.name=chemistry
server.port=8090
search.file.dir=data
search.index.cron=0 0 00 * * *

# Options: openbabel, bingo
search.repository=bingo

# Database configuration (when search.repository=bingo)
spring.datasource.url=jdbc:postgresql://localhost:5433/bingo
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver
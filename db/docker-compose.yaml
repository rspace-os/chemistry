services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: bingo-postgres:pg17
    platform: linux/amd64
    container_name: bingo-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bingo
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bingo"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
